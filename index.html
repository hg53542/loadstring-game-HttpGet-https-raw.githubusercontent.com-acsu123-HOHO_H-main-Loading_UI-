<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live 3D</title>
<style>
  :root {
    --accent: #ff2e88;
    --accent2: #2ee6ff;
    --panel: rgba(12, 10, 24, .72);
    --text: #f4f2ff;
    --muted: #a49fc4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060d; color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body.transparent { background: transparent; }
  canvas { display: block; }

  .hud { position: fixed; inset: 0; pointer-events: none; }
  .top { position: absolute; top: 16px; left: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { background: var(--accent); padding: 6px 12px; border-radius: 6px; font-weight: 800; letter-spacing: .08em;
    display: flex; align-items: center; gap: 8px; box-shadow: 0 0 20px rgba(255,46,136,.6); }
  .badge .dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: pulse 1.2s infinite; }
  .chip { background: var(--panel); padding: 6px 12px; border-radius: 6px; font-variant-numeric: tabular-nums;
    backdrop-filter: blur(6px); }
  @keyframes pulse { 50% { opacity: .25; } }

  .title { position: absolute; bottom: 16px; left: 16px; max-width: calc(100% - 32px); }
  .title h1 { margin: 0; font-size: clamp(20px, 3.2vw, 38px); text-shadow: 0 0 18px rgba(46,230,255,.7); }
  .title p { margin: 4px 0 0; color: var(--muted); font-size: clamp(12px, 1.4vw, 16px); }

  .chat { position: absolute; right: 16px; bottom: 16px; width: min(340px, calc(100% - 32px));
    display: flex; flex-direction: column; gap: 6px; }
  .msg { background: var(--panel); padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.35;
    backdrop-filter: blur(6px); border-left: 3px solid var(--accent2); animation: slideIn .35s ease-out; word-wrap: break-word; }
  .msg b { margin-right: 6px; }
  @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } }

  .panel { position: fixed; top: 16px; right: 16px; background: var(--panel); border-radius: 10px; padding: 12px;
    width: min(300px, calc(100% - 32px)); backdrop-filter: blur(8px); pointer-events: auto; font-size: 13px;
    border: 1px solid rgba(255,255,255,.08); }
  .panel h2 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .panel label { display: block; margin: 8px 0 4px; color: var(--muted); }
  .panel input[type=text] { width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid #3a3555;
    background: #14111f; color: var(--text); font: inherit; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  button { background: #231d38; color: var(--text); border: 1px solid #3a3555; border-radius: 6px; padding: 6px 10px;
    font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent2); }
  button.on { background: var(--accent); border-color: var(--accent); }
  .hint { color: var(--muted); margin-top: 10px; font-size: 12px; line-height: 1.5; }
  .panel.collapsed > :not(h2) { display: none; }
  body.obs .panel { display: none; }
</style>
</head>
<body>
<div class="hud">
  <div class="top">
    <div class="badge"><span class="dot"></span>AO VIVO</div>
    <div class="chip" id="timer">00:00:00</div>
    <div class="chip">👁 <span id="viewers">0</span></div>
  </div>
  <div class="title">
    <h1 id="liveTitle">Minha Live 3D</h1>
    <p id="liveSub">Bem-vindos ao stream!</p>
  </div>
  <div class="chat" id="chat"></div>
</div>

<div class="panel" id="panel">
  <h2>Controles <button id="collapse" title="Recolher">–</button></h2>
  <label for="inTitle">Título</label>
  <input type="text" id="inTitle" value="Minha Live 3D">
  <label for="inSub">Subtítulo</label>
  <input type="text" id="inSub" value="Bem-vindos ao stream!">
  <label for="inMsg">Mensagem no chat (Enter)</label>
  <input type="text" id="inMsg" placeholder="Digite e aperte Enter">
  <div class="row">
    <button id="btnMic">🎤 Microfone</button>
    <button id="btnOrbit" class="on">Órbita</button>
    <button id="btnBots" class="on">Chat demo</button>
  </div>
  <div class="row">
    <button data-cam="0">Câm 1</button>
    <button data-cam="1">Câm 2</button>
    <button data-cam="2">Câm 3</button>
    <button id="btnColor">Cor</button>
  </div>
  <div class="hint">
    Teclas: <b>1–3</b> câmeras · <b>O</b> órbita · <b>C</b> cor · <b>H</b> esconder painel.<br>
    OBS: adicione <code>?obs=1</code> (sem painel) e <code>&amp;transparent=1</code> (fundo transparente).
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const OBS = params.has('obs');
const TRANSPARENT = params.has('transparent');
if (OBS) document.body.classList.add('obs');
if (TRANSPARENT) document.body.classList.add('transparent');
if (params.get('title')) document.getElementById('liveTitle').textContent = params.get('title');
if (params.get('sub')) document.getElementById('liveSub').textContent = params.get('sub');

// ---------- Renderer / cena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: TRANSPARENT });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
if (!TRANSPARENT) {
  scene.background = new THREE.Color(0x07060d);
  scene.fog = new THREE.Fog(0x07060d, 14, 34);
}

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 7.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 3; controls.maxDistance = 16;

// ---------- Luzes ----------
scene.add(new THREE.HemisphereLight(0x6a5cff, 0x110820, 0.6));
const key = new THREE.SpotLight(0xffffff, 60, 30, Math.PI / 6, 0.4, 1.5);
key.position.set(3, 7, 5); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
key.target.position.set(0, 1, 0); scene.add(key, key.target);

const neonA = new THREE.PointLight(0xff2e88, 25, 12);
const neonB = new THREE.PointLight(0x2ee6ff, 25, 12);
neonA.position.set(-4, 2.5, 1); neonB.position.set(4, 2.5, 1);
scene.add(neonA, neonB);

// ---------- Palco ----------
const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({ color: 0x0d0b18, roughness: 0.35, metalness: 0.6 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const grid = new THREE.GridHelper(24, 48, 0x2ee6ff, 0x2a2350);
grid.material.transparent = true; grid.material.opacity = 0.25; grid.position.y = 0.002; scene.add(grid);

const stage = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.6, 0.3, 64),
  new THREE.MeshStandardMaterial({ color: 0x1a1530, roughness: 0.4, metalness: 0.5 }));
stage.position.y = 0.15; stage.receiveShadow = true; stage.castShadow = true; scene.add(stage);

const ringMat = new THREE.MeshBasicMaterial({ color: 0xff2e88 });
const ring = new THREE.Mesh(new THREE.TorusGeometry(2.5, 0.03, 8, 128), ringMat);
ring.rotation.x = Math.PI / 2; ring.position.y = 0.31; scene.add(ring);

// Arcos neon atrás do palco
const arches = [];
for (let i = 0; i < 5; i++) {
  const m = new THREE.MeshBasicMaterial({ color: i % 2 ? 0x2ee6ff : 0xff2e88, transparent: true, opacity: 0.85 });
  const a = new THREE.Mesh(new THREE.TorusGeometry(3.4 + i * 0.6, 0.035, 8, 96, Math.PI), m);
  a.position.set(0, 0, -2.5 - i * 1.3); scene.add(a); arches.push(a);
}

// Telão com textura animada (canvas)
const screenCanvas = document.createElement('canvas');
screenCanvas.width = 512; screenCanvas.height = 256;
const sctx = screenCanvas.getContext('2d');
const screenTex = new THREE.CanvasTexture(screenCanvas);
screenTex.colorSpace = THREE.SRGBColorSpace;
const screen = new THREE.Mesh(new THREE.PlaneGeometry(5, 2.5), new THREE.MeshBasicMaterial({ map: screenTex }));
screen.position.set(0, 3.8, -3.2); scene.add(screen);
const frame = new THREE.Mesh(new THREE.BoxGeometry(5.2, 2.7, 0.1), new THREE.MeshStandardMaterial({ color: 0x110e1f, metalness: 0.8, roughness: 0.3 }));
frame.position.set(0, 3.8, -3.26); scene.add(frame);

function drawScreen(t, level) {
  const w = screenCanvas.width, h = screenCanvas.height;
  const g = sctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, `hsl(${(t * 20) % 360}, 80%, 18%)`);
  g.addColorStop(1, `hsl(${(t * 20 + 120) % 360}, 80%, 10%)`);
  sctx.fillStyle = g; sctx.fillRect(0, 0, w, h);
  // equalizador
  const bars = 32;
  for (let i = 0; i < bars; i++) {
    const v = (Math.sin(t * 3 + i * 0.5) * 0.5 + 0.5) * (0.25 + level * 2.5) + 0.05;
    const bh = Math.min(1, v) * h * 0.55;
    sctx.fillStyle = i % 2 ? '#2ee6ff' : '#ff2e88';
    sctx.fillRect(i * (w / bars) + 3, h - bh - 10, w / bars - 6, bh);
  }
  sctx.fillStyle = '#fff'; sctx.font = 'bold 40px system-ui, sans-serif'; sctx.textAlign = 'center';
  sctx.fillText(document.getElementById('liveTitle').textContent.slice(0, 22), w / 2, 70);
  screenTex.needsUpdate = true;
}

// ---------- Avatar ----------
const avatar = new THREE.Group(); avatar.position.y = 0.3; scene.add(avatar);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8a6bff, roughness: 0.4, metalness: 0.1 });
const skinMat = new THREE.MeshStandardMaterial({ color: 0xffe0cc, roughness: 0.6 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x1b1530 });

const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.45, 0.7, 8, 24), bodyMat);
torso.position.y = 0.95; torso.castShadow = true; avatar.add(torso);

const headPivot = new THREE.Group(); headPivot.position.y = 1.75; avatar.add(headPivot);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), skinMat);
head.position.y = 0.35; head.castShadow = true; headPivot.add(head);

const hair = new THREE.Mesh(new THREE.SphereGeometry(0.53, 32, 32, 0, Math.PI * 2, 0, Math.PI * 0.55), darkMat);
hair.position.y = 0.38; hair.rotation.x = -0.25; headPivot.add(hair);

const eyes = [];
for (const x of [-0.17, 0.17]) {
  const e = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 16), darkMat);
  e.position.set(x, 0.3, 0.45); e.scale.z = 0.5; headPivot.add(e); eyes.push(e);
  const shine = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  shine.position.set(0.025, 0.03, 0.03); e.add(shine);
}
const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshStandardMaterial({ color: 0x6b1830 }));
mouth.position.set(0, 0.1, 0.43); mouth.scale.set(1.1, 0.12, 0.5); headPivot.add(mouth);

// fone de ouvido
const phoneMat = new THREE.MeshStandardMaterial({ color: 0x2ee6ff, emissive: 0x0a5a66, metalness: 0.5, roughness: 0.3 });
const band = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.04, 8, 48, Math.PI), phoneMat);
band.position.y = 0.38; headPivot.add(band);
for (const x of [-0.55, 0.55]) {
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.1, 24), phoneMat);
  cup.rotation.z = Math.PI / 2; cup.position.set(x, 0.35, 0); headPivot.add(cup);
}

const arms = [];
for (const s of [-1, 1]) {
  const pivot = new THREE.Group(); pivot.position.set(0.55 * s, 1.35, 0); avatar.add(pivot);
  const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.55, 6, 12), bodyMat);
  arm.position.y = -0.38; arm.castShadow = true; pivot.add(arm);
  const hand = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), skinMat);
  hand.position.y = -0.75; pivot.add(hand);
  pivot.rotation.z = 0.2 * s; arms.push(pivot);
}

// ---------- Partículas ----------
const PCOUNT = 600;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PCOUNT * 3);
for (let i = 0; i < PCOUNT; i++) {
  pPos[i * 3] = (Math.random() - 0.5) * 24;
  pPos[i * 3 + 1] = Math.random() * 10;
  pPos[i * 3 + 2] = (Math.random() - 0.5) * 24;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  color: 0xbfaaff, size: 0.05, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(particles);

// ---------- Câmeras ----------
const presets = [
  { pos: [0, 2.2, 7.5], target: [0, 1.5, 0] },
  { pos: [0, 2.4, 3.2], target: [0, 2.0, 0] },
  { pos: [-6, 4.5, 6], target: [0, 1.8, -1] },
];
let camAnim = null;
function goCam(i) {
  const p = presets[i]; if (!p) return;
  camAnim = { t: 0, fromP: camera.position.clone(), fromT: controls.target.clone(),
    toP: new THREE.Vector3(...p.pos), toT: new THREE.Vector3(...p.target) };
}

// ---------- Microfone ----------
let analyser = null, audioData = null, micLevel = 0;
async function toggleMic(btn) {
  if (analyser) { analyser = null; btn.classList.remove('on'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    audioData = new Uint8Array(analyser.fftSize);
    src.connect(analyser); btn.classList.add('on');
  } catch (e) {
    addMsg('Sistema', 'Não foi possível acessar o microfone: ' + e.message, '#ff6b6b');
  }
}
function readMic() {
  if (!analyser) return 0;
  analyser.getByteTimeDomainData(audioData);
  let sum = 0;
  for (const v of audioData) { const x = (v - 128) / 128; sum += x * x; }
  return Math.sqrt(sum / audioData.length);
}

// ---------- HUD: timer, viewers, chat ----------
const start = Date.now();
const timerEl = document.getElementById('timer');
const viewersEl = document.getElementById('viewers');
let viewers = 12 + Math.floor(Math.random() * 30);
const chatEl = document.getElementById('chat');
const names = ['ana_gamer', 'joaoplays', 'luz.art', 'mestre_pixel', 'bia3d', 'neonfox', 'caiodev', 'mari_live'];
const lines = ['Que cenário lindo! 😍', 'Salve salve!', 'Primeira vez aqui, curti!', 'Esse neon tá demais',
  'Boa noite chat 👋', 'Manda um salve pro pessoal', 'GG', 'Qual o horário das lives?', 'Avatar muito fofo kkk', '🔥🔥🔥'];
const colors = ['#2ee6ff', '#ff2e88', '#ffd166', '#9b8cff', '#7cff9b'];

function addMsg(name, text, color) {
  const div = document.createElement('div'); div.className = 'msg';
  div.style.borderLeftColor = color;
  const b = document.createElement('b'); b.textContent = name; b.style.color = color;
  div.append(b, document.createTextNode(text));
  chatEl.append(div);
  while (chatEl.children.length > 6) chatEl.firstChild.remove();
  wave = 1.5;
}
let bots = !params.has('nobots');
function botTick() {
  if (bots) addMsg(names[Math.random() * names.length | 0], lines[Math.random() * lines.length | 0], colors[Math.random() * colors.length | 0]);
  setTimeout(botTick, 2500 + Math.random() * 4500);
}
setTimeout(botTick, 1500);

setInterval(() => {
  const s = Math.floor((Date.now() - start) / 1000);
  timerEl.textContent = [s / 3600, (s / 60) % 60, s % 60].map(v => String(Math.floor(v)).padStart(2, '0')).join(':');
  viewers = Math.max(1, viewers + Math.round((Math.random() - 0.4) * 3));
  viewersEl.textContent = viewers;
}, 1000);

// ---------- Controles UI ----------
const $ = id => document.getElementById(id);
$('inTitle').addEventListener('input', e => $('liveTitle').textContent = e.target.value);
$('inSub').addEventListener('input', e => $('liveSub').textContent = e.target.value);
$('inMsg').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) { addMsg('Você', e.target.value.trim(), '#ffd166'); e.target.value = ''; }
});
$('btnMic').onclick = e => toggleMic(e.currentTarget);
let orbit = true;
const setOrbit = v => { orbit = v; $('btnOrbit').classList.toggle('on', v); };
$('btnOrbit').onclick = () => setOrbit(!orbit);
$('btnBots').onclick = e => { bots = !bots; e.currentTarget.classList.toggle('on', bots); };
$('btnBots').classList.toggle('on', bots);
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => { setOrbit(false); goCam(+b.dataset.cam); });

let hue = 0.92;
function cycleColor() {
  hue = (hue + 0.13) % 1;
  const c = new THREE.Color().setHSL(hue, 1, 0.55);
  ringMat.color.copy(c); neonA.color.copy(c); bodyMat.color.setHSL((hue + 0.5) % 1, 0.6, 0.6);
}
$('btnColor').onclick = cycleColor;
$('collapse').onclick = () => $('panel').classList.toggle('collapsed');

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key >= '1' && e.key <= '3') { setOrbit(false); goCam(+e.key - 1); }
  else if (e.key.toLowerCase() === 'o') setOrbit(!orbit);
  else if (e.key.toLowerCase() === 'c') cycleColor();
  else if (e.key.toLowerCase() === 'h') $('panel').style.display = $('panel').style.display === 'none' ? '' : 'none';
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Loop ----------
const clock = new THREE.Clock();
let blink = 0, nextBlink = 2, wave = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  micLevel += (readMic() - micLevel) * 0.35;
  const talking = analyser ? micLevel : Math.max(0, Math.sin(t * 9) * Math.sin(t * 1.3)) * 0.06;

  // avatar
  avatar.position.y = 0.3 + Math.sin(t * 2) * 0.03;
  torso.scale.set(1, 1 + Math.sin(t * 2) * 0.015, 1);
  headPivot.rotation.y = Math.sin(t * 0.7) * 0.25;
  headPivot.rotation.z = Math.sin(t * 0.9) * 0.06;
  headPivot.rotation.x = -talking * 1.5;
  mouth.scale.y = 0.12 + Math.min(1, talking * 12) * 0.8;

  nextBlink -= dt;
  if (nextBlink <= 0) { blink = 1; nextBlink = 2 + Math.random() * 4; }
  blink = Math.max(0, blink - dt * 8);
  eyes.forEach(e => e.scale.y = 1 - Math.sin(blink * Math.PI) * 0.9);

  wave = Math.max(0, wave - dt);
  arms[1].rotation.z = 0.2 + Math.min(1, wave) * 2.4;
  arms[1].rotation.x = Math.min(1, wave) * Math.sin(t * 14) * 0.3;
  arms[0].rotation.z = -0.2 - Math.sin(t * 2) * 0.05;

  // cenário
  ring.scale.setScalar(1 + talking * 0.6);
  arches.forEach((a, i) => { a.material.opacity = 0.45 + 0.4 * Math.sin(t * 2 + i); });
  neonA.intensity = 20 + Math.sin(t * 3) * 8 + talking * 120;
  neonB.intensity = 20 + Math.cos(t * 3) * 8 + talking * 120;
  neonA.position.x = -4 + Math.sin(t * 0.6) * 1.5;
  neonB.position.x = 4 + Math.cos(t * 0.6) * 1.5;
  particles.rotation.y = t * 0.02;
  const arr = pGeo.attributes.position.array;
  for (let i = 1; i < arr.length; i += 3) { arr[i] += dt * 0.15; if (arr[i] > 10) arr[i] = 0; }
  pGeo.attributes.position.needsUpdate = true;
  if ((t * 30 | 0) % 2 === 0) drawScreen(t, talking);

  // câmera
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt * 1.2);
    const k = camAnim.t * camAnim.t * (3 - 2 * camAnim.t);
    camera.position.lerpVectors(camAnim.fromP, camAnim.toP, k);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, k);
    if (camAnim.t >= 1) camAnim = null;
  } else if (orbit) {
    const r = Math.hypot(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
    const ang = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z) + dt * 0.12;
    camera.position.x = controls.target.x + Math.sin(ang) * r;
    camera.position.z = controls.target.z + Math.cos(ang) * r;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
